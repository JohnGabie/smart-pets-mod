plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

base.archivesName = 'smartpets'

loom {
	splitEnvironmentSourceSets()
	mods {
		"smartpets" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
	runs {
		// The 'clientGameTest' run is created by fabricApi.configureTests; configure it when it appears.
		// Dev-only commands (DevMode) are registered only when this property is set.
		configureEach {
			if (name == "clientGameTest") {
				property "smartpets.dev", "true"
			}
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation project(':core')
	include project(':core')
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") { expand "version": version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 25 }

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "smartpets-test"
		// Server GameTests off until one exists: when on, Loom hooks runGameTest into check/build.
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}
