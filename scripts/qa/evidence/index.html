<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Banco de evidências</title>
<style>
:root{--bg:#f6f7f9;--fg:#1c2128;--muted:#5b6573;--card:#fff;--line:#d5dae1;--accent:#1f6feb;--warn:#b35900;--bad:#c62828;--ok:#2e7d32;--chip:#eef1f5}
@media (prefers-color-scheme:dark){:root{--bg:#12151a;--fg:#e6e9ee;--muted:#9aa4b2;--card:#1a1f26;--line:#2d343e;--accent:#6aa5ff;--warn:#ffb454;--bad:#ff7b72;--ok:#6fcf7c;--chip:#242b34}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,sans-serif;padding:16px}
h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
.bar input,.bar select{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit;min-width:0}
.bar input[type=search]{flex:1 1 220px}
.bar label{display:flex;gap:4px;align-items:center}
.alert{background:var(--card);border:2px solid var(--warn);border-radius:8px;padding:8px 12px;margin:8px 0;font-weight:600}
.msg{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px}
.msg code,pre{background:var(--chip);padding:2px 5px;border-radius:4px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line)}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
th{position:sticky;top:0;background:var(--chip);font-size:.85rem}
td.id{white-space:nowrap;font-weight:600}
.chip{display:inline-block;background:var(--chip);border-radius:10px;padding:0 8px;margin:1px 2px 1px 0;font-size:.82rem}
.badge{display:inline-block;border-radius:4px;padding:0 6px;font-size:.8rem;font-weight:600;border:1px solid currentColor}
.b-unexpected{color:var(--warn)}.b-info{color:var(--accent)}.b-dec{color:var(--bad)}.b-st{color:var(--muted)}
button.lnk,button.thumb{font:inherit;color:var(--accent);background:none;border:0;padding:2px;cursor:pointer;text-decoration:underline}
button.thumb{padding:0;border:1px solid var(--line);border-radius:4px;margin:2px;text-decoration:none;background:var(--chip)}
button.thumb img{display:block;width:64px;height:48px;object-fit:cover;border-radius:3px}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,video:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
tr.detail td{background:var(--bg)}
.detail dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;margin:0}
.detail dt{font-weight:600;color:var(--muted)}.detail dd{margin:0;overflow-wrap:anywhere}
.detail video{max-width:100%;max-height:240px;display:block;margin:4px 0}
.opt{margin:2px 0}
.warn{color:var(--warn);font-weight:600}
figure{margin:4px 0}figcaption{font-size:.8rem;color:var(--muted)}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:10;padding:16px}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:80vh;background:#fff}
#lb p{color:#fff;margin:8px 0}
#lb button{background:#fff;color:#000;border:0;border-radius:6px;padding:6px 14px;font:inherit;cursor:pointer}
td{overflow-wrap:break-word}
@media (max-width:760px){
 table,thead,tbody,tr,td{display:block}
 thead{position:absolute;left:-9999px}
 table{border:0;background:none}
 tr.rec{background:var(--card);border:1px solid var(--line);border-radius:8px;margin:0 0 12px;padding:4px 0}
 td{border:0;padding:4px 10px}
 td[data-l]::before{content:attr(data-l) ": ";font-weight:600;color:var(--muted)}
 tr.detail td{border-radius:8px}
 .detail dl{grid-template-columns:1fr}
}
</style>
</head>
<body>
<h1>Banco de evidências</h1>
<p class="sub">Somente leitura. Os agentes gravam apenas <code>.evidence/data.js</code>; esta página só mostra. <span id="src"></span></p>
<div id="app"></div>
<div id="lb" role="dialog" aria-modal="true" aria-label="Imagem ampliada"><img alt=""><p></p><button type="button" id="lbx">Fechar (Esc)</button></div>
<script>
(function(){
"use strict";
var EXAMPLE=/[?&]example=1(&|$)/.test(location.search);
var DATA=EXAMPLE?"example/data.js":"../../../.evidence/data.js";
var BASE=EXAMPLE?"example/":"../../../.evidence/";
var app=document.getElementById("app");
document.getElementById("src").textContent=EXAMPLE?"Modo exemplo: dados FICTÍCIOS.":"";

function el(tag,props,kids){var e=document.createElement(tag);
 if(props)for(var k in props){if(k==="text")e.textContent=props[k];else if(k==="cls")e.className=props[k];else e.setAttribute(k,props[k]);}
 (kids||[]).forEach(function(c){if(c!=null)e.appendChild(typeof c==="string"?document.createTextNode(c):c);});return e;}
function str(v){return v==null?"":String(v);}
function safePath(p){
 if(typeof p!=="string"||!p||p.length>300)return null;
 if(!/^[A-Za-z0-9._\- \/]+$/.test(p))return null;
 if(p.charAt(0)==="/"||p.indexOf("//")>=0)return null;
 var parts=p.split("/");
 for(var i=0;i<parts.length;i++){if(parts[i]===".."||parts[i]==="."||parts[i]==="")return null;}
 return BASE+parts.map(encodeURIComponent).join("/");
}
function missing(){
 app.textContent="";
 var m=el("div",{cls:"msg",role:"alert"});
 m.appendChild(el("p",{text:"Não foi possível carregar os dados de evidência ("+DATA+")."}));
 m.appendChild(el("p",{},["Crie o arquivo ",el("code",{text:".evidence/data.js"})," na raiz do repositório contendo exatamente ",el("code",{text:"window.EVIDENCE = [ ... ];"}),". Esquema: ",el("code",{text:"scripts/qa/evidence/README.md"}),". Valide com ",el("code",{text:"bash scripts/qa/evidence/check.sh"}),"."]));
 m.appendChild(el("p",{},[el("a",{href:"?example=1",text:"Ver exemplo fictício (?example=1)"})]));
 app.appendChild(m);
}
var s=document.createElement("script");
s.src=DATA;
s.onerror=missing;
s.onload=function(){ if(!Array.isArray(window.EVIDENCE)){missing();return;} start(window.EVIDENCE); };
document.head.appendChild(s);

var lb=document.getElementById("lb"),lastFocus=null;
function openLb(url,cap){lastFocus=document.activeElement;lb.querySelector("img").src=url;lb.querySelector("img").alt=cap;lb.querySelector("p").textContent=cap;lb.classList.add("on");document.getElementById("lbx").focus();}
function closeLb(){lb.classList.remove("on");lb.querySelector("img").removeAttribute("src");if(lastFocus)lastFocus.focus();}
document.getElementById("lbx").onclick=closeLb;
lb.onclick=function(e){if(e.target===lb)closeLb();};
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&lb.classList.contains("on"))closeLb();});

function needsDecision(r){return r&&r.decision_needed&&typeof r.decision_needed==="object"&&r.status!=="decided"&&r.status!=="fixed";}
function mediaList(r){return Array.isArray(r.media)?r.media:[];}

function start(all){
 var recs=all.filter(function(r){return r&&typeof r==="object";}).slice().sort(function(a,b){
  var d=str(b.date).localeCompare(str(a.date));return d||str(b.id).localeCompare(str(a.id));});
 app.textContent="";
 var nDec=recs.filter(needsDecision).length;
 var alertBox=el("div",{cls:"alert",role:"status"});
 alertBox.hidden=nDec===0;
 alertBox.textContent="Decisões necessárias: "+nDec;
 var q=el("input",{type:"search",name:"q","aria-label":"Buscar",placeholder:"Buscar texto..."});
 var fk=el("select",{name:"kind","aria-label":"Tipo"},[el("option",{value:"",text:"Tipo: todos"}),el("option",{value:"info",text:"info"}),el("option",{value:"unexpected",text:"unexpected"})]);
 var fs=el("select",{name:"status","aria-label":"Status"},[el("option",{value:"",text:"Status: todos"})].concat(["open","seen","decided","fixed"].map(function(x){return el("option",{value:x,text:x});})));
 var fd=el("input",{type:"checkbox",id:"fd",name:"fd"});
 var count=el("span",{cls:"sub"});
 app.appendChild(alertBox);
 app.appendChild(el("div",{cls:"bar"},[q,fk,fs,el("label",{},[fd,"decisão necessária"]),count]));
 var table=el("table",{},[el("thead",{},[el("tr",{},["ID","Nome","Teste","O que estava sendo testado","Entidades","Descrição","Mídias"].map(function(h){return el("th",{scope:"col",text:h});}))])]);
 var tb=el("tbody");table.appendChild(tb);app.appendChild(table);
 var empty=el("p",{cls:"msg",text:"Nenhum registro."});app.appendChild(empty);

 var rows=recs.map(function(r){return build(r);});
 rows.forEach(function(x){tb.appendChild(x.tr);tb.appendChild(x.dt);});

 function hay(r){return [r.id,r.name,r.test,r.under_test,(Array.isArray(r.entities)?r.entities.join(" "):""),r.description,r.why_it_matters,r.status,r.kind].map(str).join(" ").toLowerCase();}
 function apply(){
  var t=q.value.toLowerCase(),n=0;
  rows.forEach(function(x){var r=x.r;
   var ok=(!t||x.hay.indexOf(t)>=0)&&(!fk.value||r.kind===fk.value||(fk.value==="info"&&!r.kind))&&(!fs.value||r.status===fs.value)&&(!fd.checked||needsDecision(r));
   x.tr.hidden=!ok;if(!ok)x.dt.hidden=true;if(ok)n++;});
  count.textContent=n+" de "+rows.length+" registros";empty.hidden=n>0;}
 rows.forEach(function(x){x.hay=hay(x.r);});
 q.oninput=apply;fk.onchange=apply;fs.onchange=apply;fd.onchange=apply;apply();
}

function build(r){
 var tr=el("tr",{cls:"rec"}),dt=el("tr",{cls:"detail"});dt.hidden=true;
 var det=el("td",{colspan:"7"});dt.appendChild(det);
 var idCell=el("td",{cls:"id","data-l":"ID"});
 var btn=el("button",{type:"button",cls:"lnk","aria-expanded":"false",text:str(r.id)||"(sem id)"});
 btn.title="Mostrar/ocultar detalhes";
 btn.onclick=function(){dt.hidden=!dt.hidden;btn.setAttribute("aria-expanded",String(!dt.hidden));};
 idCell.appendChild(btn);
 if(r.kind==="unexpected")idCell.appendChild(el("div",{},[el("span",{cls:"badge b-unexpected",text:"inesperado"})]));
 if(needsDecision(r))idCell.appendChild(el("div",{},[el("span",{cls:"badge b-dec",text:"decisão"})]));
 tr.appendChild(idCell);
 tr.appendChild(el("td",{"data-l":"Nome",text:str(r.name)}));
 tr.appendChild(el("td",{"data-l":"Teste",text:str(r.test)}));
 tr.appendChild(el("td",{"data-l":"O que estava sendo testado",text:str(r.under_test)}));
 var ec=el("td",{"data-l":"Entidades"});
 (Array.isArray(r.entities)?r.entities:[]).forEach(function(e){ec.appendChild(el("span",{cls:"chip",text:str(e)}));});
 tr.appendChild(ec);
 tr.appendChild(el("td",{"data-l":"Descrição",text:str(r.description)}));
 var mc=el("td",{"data-l":"Mídias"});
 mediaList(r).forEach(function(m){mc.appendChild(mediaThumb(m));});
 tr.appendChild(mc);

 var dl=el("dl");
 function row(k,v){if(v==null||v==="")return;dl.appendChild(el("dt",{text:k}));dl.appendChild(el("dd",{},[typeof v==="string"?document.createTextNode(v):v]));}
 row("Data",str(r.date));
 row("Tipo",str(r.kind||"info"));
 row("Status",str(r.status));
 row("Por que importa",str(r.why_it_matters));
 if(r.reproduction&&typeof r.reproduction==="object"){
  var rp=r.reproduction;row("Reprodução",str(rp.reproduced)+" de "+str(rp.runs)+" execuções reproduziram"+(rp.how?" — "+str(rp.how):""));}
 var d=r.decision_needed;
 if(d&&typeof d==="object"){
  var box=el("div");
  box.appendChild(el("div",{text:str(d.question)}));
  (Array.isArray(d.options)?d.options:[]).forEach(function(o,i){
   box.appendChild(el("div",{cls:"opt",text:(i+1)+". "+str(o&&o.label)+(o&&o.consequence?" — "+str(o.consequence):"")}));});
  if(d.recommendation)box.appendChild(el("div",{},[el("strong",{text:"Recomendação: "}),str(d.recommendation)]));
  if(d.default_if_no_answer)box.appendChild(el("div",{},[el("strong",{text:"Padrão se sem resposta: "}),str(d.default_if_no_answer)]));
  row("Decisão necessária",box);}
 if(Array.isArray(r.links)&&r.links.length){var lk=el("div");r.links.forEach(function(l){lk.appendChild(el("div",{text:str(l)}));});row("Links",lk);}
 det.appendChild(dl);
 var vids=mediaList(r).filter(function(m){return m&&m.type==="video";});
 vids.forEach(function(m){var u=safePath(m.path);if(!u)return;
  var f=el("figure"),v=el("video",{controls:"",preload:"metadata",src:u});f.appendChild(v);f.appendChild(el("figcaption",{text:str(m.caption)}));det.appendChild(f);});
 return {r:r,tr:tr,dt:dt};
}

function mediaThumb(m){
 m=m||{};
 var u=safePath(m.path),cap=str(m.caption)||str(m.path);
 if(!u)return el("div",{cls:"warn",text:"Mídia ignorada (caminho inseguro): "+str(m.path)});
 if(m.type==="image"){
  var b=el("button",{type:"button",cls:"thumb","aria-label":"Ampliar: "+cap,title:cap});
  b.appendChild(el("img",{src:u,alt:cap,loading:"lazy"}));
  b.onclick=function(){openLb(u,cap);};return b;}
 if(m.type==="video"){return el("span",{cls:"chip",text:"vídeo: "+cap+" (veja nos detalhes)"});}
 return el("div",{cls:"warn",text:"Tipo de mídia desconhecido: "+str(m.type)});
}
})();
</script>
</body>
</html>
